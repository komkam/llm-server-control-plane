global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 5s
  external_labels:
    platform: llm-server
    environment: production

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: docker
    static_configs:
      - targets: ["host.docker.internal:9402"]

  - job_name: gpu
    static_configs:
      - targets: ["host.docker.internal:9401"]

  - job_name: control_plane
    static_configs:
      - targets: ["host.docker.internal:9400"]


  - job_name: otel_collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]
